{% extends "base.html" %}
{% block title %}{{ animal.name }} — WildNest{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <a href="{{ url_for('auth.dashboard_redirect') }}" class="btn btn-sm wn-btn-outline mb-3">
            <i class="bi bi-arrow-left me-1"></i>Back to Dashboard
        </a>

        <div class="wn-card wn-coming-soon p-5 text-center">
            <i class="bi bi-lock-fill" style="font-size:2.5rem; opacity:0.3;"></i>
            <h5 class="fw-bold mt-3 mb-2">This profile is private</h5>
            <p class="text-muted mb-0">
                {{ animal.owner.name }} has made {{ animal.name }}'s profile private.
                You no longer have access to view it.
            </p>
        </div>
    </div>
</div>
{% endblock %}
