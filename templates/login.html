{% extends "base.html" %}
{% block title %}Login — WildNest{% endblock %}

{% block content %}
<div class="wn-auth-wrap">
    <div class="wn-auth-inner">

        <div class="text-center mb-3">
            <div style="font-size:2.6rem;">🐾</div>
            <h2 class="fw-bold wn-green mt-1 mb-1">WildNest</h2>
            <p class="text-muted small mb-0">The animal's complete story, always with them.</p>
        </div>

        <div class="wn-card p-4">
            <h6 class="fw-bold mb-4">Sign In</h6>
            <form method="POST" novalidate>
                <div class="mb-3">
                    <label class="form-label text-muted small">Email Address</label>
                    <input type="email" name="email" class="form-control wn-input"
                           placeholder="you@example.com" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted small">Password</label>
                    <input type="password" name="password" class="form-control wn-input"
                           placeholder="••••••••" required>
                </div>
                <div class="mb-4 form-check">
                    <input type="checkbox" name="remember" class="form-check-input" id="remember">
                    <label class="form-check-label text-muted small" for="remember">Keep me signed in</label>
                </div>
                <button type="submit" class="btn wn-btn-primary w-100 py-2">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                </button>
            </form>
            <hr class="my-3 wn-divider">
            <p class="text-center text-muted small mb-0">
                New to WildNest? <a href="{{ url_for('auth.register') }}" class="wn-link">Create account</a>
            </p>
        </div>

    </div>
</div>
{% endblock %}
